name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - run: npm install
      - run: npm run build
      - run: npm install -g @capacitor/cli
      - run: npx cap add android
      - run: npx cap sync android
      - name: Update package name and manifest
        run: |
          find android -name "*.gradle" -exec sed -i 's/com.blankcanvasai.app/com.blankcanvas.ai/g' {} \;
          find android -name "AndroidManifest.xml" -exec sed -i 's/com.blankcanvasai.app/com.blankcanvas.ai/g' {} \;
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="com.google.android.gms.permission.AD_ID"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>/' android/app/src/main/AndroidManifest.xml
      - name: Update AGP and Java version globally
        run: |
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.9.1/" android/build.gradle
          cat >> android/build.gradle << 'EOF'
          subprojects {
            afterEvaluate {
              if (it.hasProperty('android')) {
                android {
                  compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21
                  }
                }
              }
            }
          }
          EOF
      - name: Write build.gradle
        - name: Check final targetSdk
        run: |
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle
          echo "=== capacitor.build.gradle ==="
          cat android/app/capacitor.build.gradle || echo "not found"
          echo "=== Searching all gradle files for targetSdk ==="
          grep -r "targetSdk" android/ || echo "none found"
