name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Clear Gradle cache
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper
      - run: npm install
      - run: npm run build
      - run: npm install -g @capacitor/cli
      - run: npx cap add android
      - run: npx cap sync android
      - name: Update package name and manifest
        run: |
          find android -name "*.gradle" -exec sed -i 's/com.blankcanvasai.app/com.blankcanvas.ai/g' {} \;
          find android -name "AndroidManifest.xml" -exec sed -i 's/com.blankcanvasai.app/com.blankcanvas.ai/g' {} \;
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a\    <uses-permission android:name="com.google.android.gms.permission.AD_ID"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>/' android/app/src/main/AndroidManifest.xml
      - name: Write build.gradle
        run: |
          cat > android/app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android {
            namespace "com.blankcanvas.ai"
            compileSdk 35
            defaultConfig {
              applicationId "com.blankcanvas.ai"
              minSdkVersion 22
              targetSdkVersion 35
              versionCode 13
              versionName "1.1.3"
            }
            buildTypes {
              release {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
              }
            }
          }
          repositories {
            flatDir {
              dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
            }
          }
          dependencies {
            implementation fileTree(include: ['*.jar'], dir: 'libs')
            implementation project(':capacitor-android')
            implementation project(':capacitor-app')
            implementation project(':capacitor-camera')
            implementation project(':capacitor-haptics')
            implementation project(':capacitor-keyboard')
            implementation project(':capacitor-status-bar')
            implementation 'androidx.core:core-splashscreen:1.0.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.8.0'
          }
          apply from: 'capacitor.build.gradle'
          try {
            def servicesJSON = file('google-services.json')
            if (servicesJSON.text) {
              apply plugin: 'com.google.gms.google-services'
            }
          } catch(Exception e) {
            logger.info("google-services.json not found, not applying google-services plugin")
          }
          GRADLE
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Build Signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: blank-canvas-ai-release
          path: android/app/build/outputs/bundle/release/app-release.aab
