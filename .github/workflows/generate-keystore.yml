name: Generate Keystore
on:
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias blankcanvasai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass BlankCanvas2024! \
            -keypass BlankCanvas2024! \
            -dname "CN=Blank Canvas AI, OU=Mobile, O=Blank Canvas, L=London, S=England, C=GB"
      - name: Convert to Base64
        run: base64 -w 0 release.keystore > keystore-base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore-base64.txt
